name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PenguinPeek version
      description: Shown at the bottom of the flyout.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver`.
      placeholder: "Windows 11 24H2 (26100)"
    validations:
      required: true
  - type: textarea
    id: wsl
    attributes:
      label: WSL details
      description: Output of `wsl --version` and `wsl -l -v` (distro names are fine to redact).
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, steps to reproduce, services involved...
