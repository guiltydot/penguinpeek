name: Feature request
description: Suggest an idea for PenguinPeek
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the need rather than the solution, if you can.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: markdown
    attributes:
      value: |
        PenguinPeek is deliberately a small tray app that stays light. Ideas that fit the flyout or tray
        menu and don't add background work are the easiest to accept.
